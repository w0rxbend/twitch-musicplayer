server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Runtime configuration, rewritten on every container start. Must never be
    # cached, or a browser would keep pointing at a previous deployment's backend.
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
        try_files $uri =404;
    }

    # Admin management UI, reachable as both /admin and /admin.html
    location = /admin {
        try_files /admin.html =404;
    }

    # Hashed build assets are immutable, so they can be cached hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else falls through to the SPA, which routes on pathname.
    # Covers /, /overlay, /logo, /logo-overlay, /spectrum and /spectrum-overlay.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
