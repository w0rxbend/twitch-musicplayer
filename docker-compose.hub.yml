# ─────────────────────────────────────────────────────────────────────────────
# Run the station from images published on Docker Hub. Nothing is built, so
# this file works on a machine that has never seen the source.
#
#   curl -O https://raw.githubusercontent.com/w0rxbend/twitch-musicplayer/main/docker-compose.hub.yml
#   MUSIC_DIR=~/Music docker compose -f docker-compose.hub.yml up -d
#
# Frontend: http://localhost:3000        Admin: http://localhost:3000/admin
# Backend:  http://localhost:8080        Swagger: http://localhost:8080/swagger
#
# Deploying somewhere other than localhost? Set BASE_URL and BACKEND_URL to the
# address your browser will use, for example https://radio.example.com:8080.
# ─────────────────────────────────────────────────────────────────────────────

name: lofi-radio

services:
  backend:
    image: ${DOCKERHUB_NAMESPACE:-worxbend}/lofi-radio-backend:${IMAGE_TAG:-latest}
    pull_policy: always
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ${MUSIC_DIR:-./music}:/music:ro
      - bloom-data:/data
    environment:
      PORT: "8080"
      MUSIC_DIR: /music
      BLOOM_PATH: /data/lofi-radio.bloom
      BASE_URL: ${BASE_URL:-http://localhost:8080}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    image: ${DOCKERHUB_NAMESPACE:-worxbend}/lofi-radio-frontend:${IMAGE_TAG:-latest}
    pull_policy: always
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      # The published image has no backend URL compiled in. Leave this empty and
      # the page uses the host it was served from on port 8080; set it when the
      # backend lives somewhere else, or behind TLS.
      BACKEND_URL: ${BACKEND_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  bloom-data:
